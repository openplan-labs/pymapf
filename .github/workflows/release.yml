name: release

# Every merge to main can release. Nobody picks a number and nothing waits for
# approval: the merged commits decide.
#
#   plan   reads the Conventional Commits since the last v* tag and decides the
#          bump (scripts/release/plan.py): a breaking change (`!` or a
#          BREAKING CHANGE footer) major -- minor while below 1.0 -- feat minor,
#          fix/perf/revert patch, anything else nothing. A release:major,
#          release:minor, release:patch or release:none label on the merged pull
#          request overrides it.
#   bump   bumps pymapf/__init__.py and CITATION.cff, moves the [Unreleased]
#          changelog notes under a dated heading (scripts/release/bump.py),
#          commits "chore(release): vX.Y.Z" to main and tags it. Both are pushed
#          with the workflow token, which does not start workflows, so the
#          release commit does not release again.
#   then   the tag is tested on every supported Python, built, installed in a
#          clean environment, published to PyPI and released on GitHub -- all in
#          this run, which is the workflow PyPI's trusted publisher trusts.
#
# The same pipeline runs for a v* tag pushed by hand (released as it is), and
# by hand from the Actions tab: with `bump` to cut a release, or with
# bump=none to rehearse the current version on TestPyPI.
#
# The version is *read from the package* and the build fails if the tag
# disagrees with it, so a mislabelled artifact cannot be published by accident.
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored here.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Release: the part of the version to bump (none = rehearse the current version)'
        required: true
        default: none
        type: choice
        options: [none, patch, minor, major]
      target:
        description: 'Where a bump=none rehearsal publishes'
        required: true
        default: testpypi
        type: choice
        options: [testpypi, none]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- plan ---
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      bump: ${{ steps.plan.outputs.bump }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_BUMP: ${{ inputs.bump }}
          DISPATCH_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "a tag was pushed: release $GITHUB_REF_NAME as it is"
            { echo run=true; echo tag="$GITHUB_REF_NAME"; echo publish=pypi; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$DISPATCH_BUMP" = none ]; then
              echo "rehearsal of the current version, publishing to: $DISPATCH_TARGET"
              { echo run=true; echo publish="$DISPATCH_TARGET"; } >> "$GITHUB_OUTPUT"
            else
              echo "release requested by hand: $DISPATCH_BUMP"
              { echo run=true; echo bump="$DISPATCH_BUMP"; echo publish=pypi; } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # A push to main: the merged commits decide, a release:* label wins.
          bump="$(python3 scripts/release/plan.py)"
          labels="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[0].labels[].name' 2>/dev/null || true)"
          for part in none major minor patch; do
            if printf '%s\n' "$labels" | grep -qx "release:$part"; then
              echo "label release:$part overrides the commits ($bump)"
              bump="$part"; break
            fi
          done
          [ "$bump" = none ] && bump=""
          echo "commits since $(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo 'the start'): release ${bump:-nothing}"
          if [ -n "$bump" ]; then
            { echo run=true; echo bump="$bump"; echo publish=pypi; } >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------- bump ---
  bump:
    needs: plan
    if: needs.plan.outputs.bump != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - id: bump
        env:
          PART: ${{ needs.plan.outputs.bump }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release/bump.py "$PART")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(release): v$version"
          git tag -a "v$version" -m "pymapf $version"
          # The workflow token's pushes start no workflow, so this cannot loop.
          git push origin HEAD:main "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "released v$version"

  # ---------------------------------------------------------------- tests ---
  # The package is published only if it passes on every Python it claims to
  # support. This duplicates tests.yml on purpose: a tag is the one moment
  # where "CI was green on some earlier commit" is not good enough. Duplication
  # has a cost, though -- this matrix kept testing 3.8 and 3.9 for a whole
  # release after tests.yml and `requires-python` had moved to 3.10, and the
  # v0.9.0 tag failed here rather than in CI. Both matrices move together.
  test:
    needs: [plan, bump]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.bump.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.tag || needs.plan.outputs.tag || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Test
        run: pytest -q

  # ---------------------------------------------------------------- build ---
  build:
    needs: [plan, bump, test]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          TAG: ${{ needs.bump.outputs.tag || needs.plan.outputs.tag }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Read the version from the package
        id: version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('pymapf/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package version: $VERSION"

      - name: Refuse to publish if the tag disagrees with the package
        if: steps.tag.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="${RELEASE_TAG#v}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match pymapf.__version__ ($VERSION)."
            echo "Bump pymapf/__init__.py or retag; publishing a mislabelled"
            echo "artifact to PyPI cannot be undone."
            exit 1
          fi
          echo "tag v$TAG matches the package version"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - name: Nothing large or generated should be in the artifact
        run: |
          python - <<'PY'
          import os, tarfile, zipfile
          for name in sorted(os.listdir("dist")):
              path = os.path.join("dist", name)
              entries = (tarfile.open(path).getnames() if name.endswith(".tar.gz")
                         else zipfile.ZipFile(path).namelist())
              leaked = [e for e in entries if e.endswith((".mp4", ".gif", ".ipynb"))]
              assert not leaked, "media leaked into %s: %s" % (name, leaked[:5])
              size = os.path.getsize(path) / 1e6
              assert size < 5, "%s is %.1f MB -- something is being bundled" % (name, size)
              print("%-40s %5.2f MB  %d entries" % (name, size, len(entries)))
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # --------------------------------------------------------------- verify ---
  # Install the built wheel the way a user would -- clean interpreter, no
  # source tree, no dev dependencies -- and check it actually works. This is
  # the step that catches a broken release while it is still fixable: a version
  # number on PyPI can never be reused, so "publish and see" is not available.
  verify:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install the wheel on its own
        run: python -m pip install dist/*.whl

      - name: The core must work with no third-party dependency at all
        run: |
          cd "$(mktemp -d)"    # away from the source tree, so this imports the install
          python - <<'PY'
          # Ask the metadata rather than parsing `pip freeze`: a wheel installed
          # from a path is frozen as `pymapf @ file:///...`, which any
          # whitespace-splitting check reads as three unknown packages.
          from importlib.metadata import distributions
          seen = sorted({d.metadata["Name"].lower() for d in distributions()})
          extra = [n for n in seen if n not in ("pymapf", "pip", "setuptools", "wheel")]
          assert not extra, "the core pulled in dependencies: %s" % extra

          import pymapf
          scenario = pymapf.build_scenario("warehouse", n_agents=6, seed=1)
          solution = pymapf.solve(scenario.to_problem(), "cbs")
          assert solution is not None and solution.is_valid(), "CBS produced no valid plan"
          assert set(pymapf.available_solvers()) >= {"cbs", "wcbs", "pibt", "lacam", "lns"}
          print("pymapf", pymapf.__version__, "- CBS cost", solution.sum_of_costs,
                "- solvers", pymapf.available_solvers())
          PY

      - name: The extras must install and import
        run: |
          # Extras on a local wheel go in brackets *after the path*. The PEP 508
          # direct-reference spelling (`pymapf[rl] @ <path>`) needs a URL and is
          # rejected outright for a bare path, so this must not be "fixed" into
          # that form.
          python -m pip install "$(ls dist/*.whl)[rl]"
          cd "$(mktemp -d)"
          python -c "
          from pymapf.rl import MAPFEnv, make_trainer
          env = MAPFEnv('empty_room', height=6, width=6, n_agents=2, randomise=False)
          trainer = make_trainer('ippo', env, n_envs=2, rollout_steps=8, seed=0)
          trainer.learn(total_steps=200)
          print('pymapf.rl trains from a clean install')
          "

  # -------------------------------------------------------------- publish ---
  # Trusted Publishing: PyPI trusts this workflow by name, so no API token is
  # stored here. It must be registered once, by a project owner, at
  #   https://pypi.org/manage/project/pymapf/settings/publishing/
  # with owner `openplan-labs`, repository `pymapf`, workflow `release.yml`,
  # and environment `pypi` (or `testpypi` for the dry-run target below).
  #
  # The owner is part of what PyPI matches on, so renaming the GitHub
  # organisation invalidates a publisher registered under the old name: the
  # token is valid and the upload still fails, with `invalid-publisher`. This
  # project was registered while the organisation was APLA-Toolbox, so that
  # entry has to be updated to openplan-labs before a release can publish.
  publish-testpypi:
    needs: [plan, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.plan.outputs.publish == 'testpypi' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pymapf
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: [plan, build, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.plan.outputs.publish == 'pypi' && needs.build.outputs.tag != '' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymapf
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # --------------------------------------------------------------- release ---
  # Gated on `verify`, not on `publish-pypi`. The GitHub Release describes the
  # repository and carries artifacts this workflow has already installed and
  # run; whether the index accepted them is a separate system with its own
  # failure modes -- an unregistered trusted publisher, a name taken since the
  # build. Making the release depend on PyPI means one of those erases the
  # release too, and a tag cannot be cleanly re-pushed to try again. So the
  # release is published either way, and says which happened.
  github-release:
    needs: [build, verify, publish-pypi]
    if: ${{ always() && needs.build.outputs.tag != '' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag, not the pushed commit: on a release from a merge, only the
      # tagged release commit has this version's dated changelog entry.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Take the release notes from the changelog
        id: notes
        run: |
          python - <<'PY' > notes.md
          import re
          version = "${{ needs.build.outputs.version }}"
          published = "${{ needs.publish-pypi.result }}"
          text = open("CHANGELOG.md").read()
          # The section for this version, up to the next version heading.
          match = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## \[)" % re.escape(version),
                            text, re.S | re.M)
          body = match.group(1).strip() if match else ""
          if not body:
              body = "See [CHANGELOG.md](CHANGELOG.md)."
          print(body)
          print()
          print("---")
          print()
          # Never claim an install command that does not work yet. If PyPI did
          # not accept the upload, the artifacts attached below are still the
          # verified ones, and saying so is more use than a broken `pip install`.
          if published == "success":
              print("Install: `pip install pymapf==%s`" % version)
          else:
              print("**Not on PyPI** (publish `%s`). Install from the wheel "
                    "attached below, or from source." % (published or "skipped"))
          print()
          print("The core has no runtime dependencies. Extras: "
                "`pymapf[viz]`, `pymapf[rl]`, `pymapf[rl-torch]`, "
                "`pymapf[decentralized]`, `pymapf[all]`.")
          PY
          echo "wrote $(wc -l < notes.md) lines of release notes"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          body_path: notes.md
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
