name: playground

# Publishes .docs/ (the interactive playground) to GitHub Pages.
#
# The site loads the library's own source at runtime, so the bundle is rebuilt
# here rather than trusted from the commit: a merge that changes a solver and
# forgets to run scripts/build_web_bundle.py still ships a correct playground.

on:
  push:
    branches: [main]
    paths:
      - '.docs/**'
      - 'pymapf/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rebuild the browser bundle
        run: python scripts/build_web_bundle.py

      # Unpack the bundle and `import pymapf` from it in an interpreter with no
      # site-packages (python -I -S), then solve a tiny instance with every
      # registered solver -- the same conditions as Pyodide in the page.
      - name: Check the bundle imports cleanly
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from build_web_bundle import check
          check(".docs/pymapf-bundle.json")
          PY

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
